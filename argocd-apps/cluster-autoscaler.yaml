apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-autoscaler
  namespace: argocd
spec:
   project: default
   source:
      repoURL: git@github.com:curatimeXai/gitops-infra.git
      targetRevision: HEAD
      path: apps/cluster-autoscaler
   destination:
     server: https://kubernetes.default.svc
     namespace: kube-system
   syncPolicy:
     automated:
        prune: true
        selfHeal: true
