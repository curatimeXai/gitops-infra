apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium-gateway-infra
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com"
    targetRevision: HEAD
    path: apps/cilium-gateway
  destination:
    server: "https://default.svc"
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
