apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.10.0
      helm:
       releaseName: alloy
       valueFiles:
         - $values/argocd-apps/values-alloy.yaml
    - repoURL: https://github.com/curatimeXai/gitops-infra.git
      targetRevision: HEAD
      ref: values
       
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true  