apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: 
  name: prometheus-rule
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:curatimeXai/gitops-infra.git
    targetRevision: HEAD
    path: apps/prometheus-rule
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
