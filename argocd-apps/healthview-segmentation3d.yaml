apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: healthview-segmentation3d
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:curatimeXai/gitops-infra.git
    targetRevision: HEAD
    path: apps/healthview-segmentation3d
  destination:
    server: https://kubernetes.default.svc
    namespace: healthview-segmentation3d
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
