apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: healthview-cardiomegaly-cnn
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:curatimeXai/gitops-infra.git
    targetRevision: HEAD
    path: apps/healthview-cardiomegaly-cnn
  destination:
    server: https://kubernetes.default.svc
    namespace: healthview-cardiomegaly-cnn
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
