apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gatewayApi-crds
  namespace: argocd
spec:
   project: default
   source:
      repoURL: git@github.com:curatimeXai/gitops-infra.git
      targetRevision: HEAD
      path: argocd-apps/crds-gateway-api
   destination:
     server: https://kubernetes.default.svc
     namespace: gateway
     automated:
        prune: true
        selfHeal: true
