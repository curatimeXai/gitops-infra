apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gatewayapi-crds
  namespace: argocd
spec:
   project: default
   source:
      repoURL: git@github.com:curatimeXai/gitops-infra.git
      targetRevision: HEAD
      path: apps/crds-gateway-api
   destination:
     server: https://kubernetes.default.svc
     namespace: gateway
     syncPolicy:
      automated:
         prune: false
         selfHeal: true
