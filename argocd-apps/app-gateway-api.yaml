apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium-apiGateway
  namespace: argocd
spec:
   project: default
   source:
      repoURL: git@github.com:curatimeXai/gitops-infra.git
      targetRevision: HEAD
      path: apps/cilium-apiGateway
   destination:
     server: https://kubernetes.default.svc
     namespace: gateway
   syncPolicy:
     automated:
        prune: true
        selfHeal: true
   syncOptions:
      - CreateNamespace=true