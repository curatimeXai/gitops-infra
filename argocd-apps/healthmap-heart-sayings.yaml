apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: healthmap-heart-sayings
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:curatimeXai/gitops-infra.git
    targetRevision: HEAD
    path: apps/healthmap-heart-sayings
  destination:
    server: https://kubernetes.default.svc
    namespace: healthmap-heart-sayings
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
