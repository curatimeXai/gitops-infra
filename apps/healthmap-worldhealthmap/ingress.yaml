apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: worldhealthmap-ingress
  namespace: worldhealthmap
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - worldhealthmap.test.nightingaleheart.com
      secretName: worldhealthmap-tls
  rules:
    - host: worldhealthmap.test.nightingaleheart.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: worldhealthmap-service-frontend
                port:
                  number: 80
