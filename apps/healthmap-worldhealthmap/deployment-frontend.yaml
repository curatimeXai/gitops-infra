apiVersion: apps/v1
kind: Deployment
metadata:
  name: worldhealthmap-frontend
  namespace: worldhealthmap
  labels:
    app: worldhealthmap-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worldhealthmap-frontend
  template:
    metadata:
      labels:
        app: worldhealthmap-frontend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: worldhealthmap-frontend
          image: ghcr.io/curatimexai/nightingale-worldhealthmap:851f9e98ad34fcb99845945eef1190ddcf53498f
          ports:
            - containerPort: 80
