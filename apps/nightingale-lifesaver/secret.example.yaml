apiVersion: v1
kind: Secret
metadata:
  name: lifesaver-backend-secret
  namespace: nightingale-lifesaver
type: Opaque
stringData:
  # PostgreSQL database used by the backend / analytics service.
  # Replace these values before applying this file.
  DB_HOST: "CHANGE_ME"
  DB_PORT: "5432"
  DB_DATABASE: "CHANGE_ME"
  DB_USERNAME: "CHANGE_ME"
  DB_PASSWORD: "CHANGE_ME"
  DB_SSL: "true"

  # Backend configuration.
  # Rasa runs in the same backend container, so localhost is correct internally.
  CHATBOT_API_URL: "http://localhost:5005/webhooks/rest/webhook"
  RASA_PORT: "5005"
  API_PORT: "3000"
  NODE_ENV: "production"

  # Optional: only needed if the container must download the latest Rasa model from S3.
  RASA_MODELS_S3_BUCKET: "nightingale-lifesaver-models-prod"
  AWS_REGION: "eu-central-1"
