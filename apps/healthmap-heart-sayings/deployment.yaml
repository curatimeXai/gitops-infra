apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthmap-heart-sayings
  namespace: healthmap-heart-sayings
  labels:
    app.kubernetes.io/name: healthmap-heart-sayings
    app.kubernetes.io/part-of: healthmap
spec:
  revisionHistoryLimit: 2
  
  selector:
    matchLabels:
      app.kubernetes.io/name: healthmap-heart-sayings
  template:
    metadata:
      labels:
        app.kubernetes.io/name: healthmap-heart-sayings
        app.kubernetes.io/part-of: healthmap
    spec:
      imagePullSecrets:
          - name: ghcr-secret
      containers:
        - name: heart-sayings
          image: ghcr.io/curatimexai/heart-sayings:f2227895753a5598a598ad02bda5b0d300ca2c31
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5001
          envFrom:
            - secretRef:
                name: secret-heart-sayings
            - configMapRef:
                name: heart-sayings-configmap
                
             
        
            
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
