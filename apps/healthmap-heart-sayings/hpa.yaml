apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: healthmap-heart-sayings
  namespace: healthmap-heart-sayings
  spec:
    scaleTargetRef:
      apiVersion: apps/v1
      kind: Deployment
      name: healthmap-heart-sayings
    minReplicas: 1
    maxReplicas: 6
    metrics:
      - type: Resource
        resource : 
          name: cpu 
          target:
            type: Utilization
            averageUtilization: 75