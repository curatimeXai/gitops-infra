apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecgprediction-frontend
  namespace: ecgprediction
  labels:
    app: ecgprediction-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecgprediction-frontend
  template:
    metadata:
      labels:
        app: ecgprediction-frontend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: ecgprediction-frontend
          image: ghcr.io/curatimexai/nightingale-ecgprediction-frontend:f894c19ae8418ac52a0e8039b5a79f9a444a6f46
          ports:
            - containerPort: 80
          resource: 
            requests:
              cpu: "100m"
              memory: "128Mi"

