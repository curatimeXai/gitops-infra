apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecgprediction-frontend
  namespace: ecgprediction
  labels:
    app: ecgprediction-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecgprediction-frontend
  template:
    metadata:
      labels:
        app: ecgprediction-frontend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: ecgprediction-frontend
          image: ghcr.io/curatimexai/nightingale-ecgprediction-frontend:22223fde191523b10c08759d875d49e9090b45e1
          ports:
            - containerPort: 80

