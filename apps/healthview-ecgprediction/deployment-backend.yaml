apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecgprediction-backend
  namespace: ecgprediction
  labels:
    app: ecgprediction-backend
spec:
  revisionHistoryLimit: 2
  
  selector:
    matchLabels:
      app: ecgprediction-backend
  template:
    metadata:
      labels:
        app: ecgprediction-backend
    spec:
      
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: ecgprediction-backend
          image: ghcr.io/curatimexai/nightingale-ecgprediction-backend:ea840f0b75d274edda19cfed84238053ae28c0a4
          envFrom:
            - secretRef:
                name: ecgprediction-secret
          ports:
            - containerPort: 8000
          resources: 
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
          startupProbe:     
            tcpSocket:
              port: 8000
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8000      
            initialDelaySeconds: 30
            periodSeconds: 30


