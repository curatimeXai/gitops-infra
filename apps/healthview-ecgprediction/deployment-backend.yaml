apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecgprediction-backend
  namespace: ecgprediction
  labels:
    app: ecgprediction-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecgprediction-backend
  template:
    metadata:
      labels:
        app: ecgprediction-backend
    spec:
      imagePullSecrets:
          - name: ghcr-secret
      containers:
        - name: ecgprediction-backend
          image: ghcr.io/curatimexai/nightingale-ecgprediction-backend:f5e9d55125ddee0d560897866f03d6cf8604315b
          envFrom:
            - secretRef:
                name: ecgprediction-secret
          ports:
            - containerPort: 8000
