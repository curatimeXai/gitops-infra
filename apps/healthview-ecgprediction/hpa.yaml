apiVersion : autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: 
  name: ecgprediction-hpa
  namespace: ecgprediction
spec: 
   scaleTargetRef: 
      apiVersion: apps/v1
      kind: Deployment
      name: ecgprediction-backend
   minReplicas: 1
   maxReplicas: 6
   metrics:
      - type: Resource
        resource : 
          name : cpu
          target :
             type: Utilization
             averageUtilization: 75
      