apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthview-surgicsense-frontend
  namespace: healthview-surgicsense
  labels:
    app.kubernetes.io/name: healthview-surgicsense-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: healthview-surgicsense
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: healthview-surgicsense-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: healthview-surgicsense-frontend
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: healthview-surgicsense
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: frontend
          image: ghcr.io/curatimexai/surgicsense-frontend:58becac7d58bb73e8f8fb99409c696575c9048d4
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
