apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthview-surgicsense-backend
  namespace: healthview-surgicsense
  labels:
    app.kubernetes.io/name: healthview-surgicsense-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: healthview-surgicsense
spec:
  
  selector:
    matchLabels:
      app.kubernetes.io/name: healthview-surgicsense-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: healthview-surgicsense-backend
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: healthview-surgicsense
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: backend
          image: ghcr.io/curatimexai/surgicsense-backend:418a77d3a407d679156385ebfd600240832b7a6d
          imagePullPolicy: Always
          ports:
            - name: api
              containerPort: 8000
          envFrom:
            - secretRef:
                name: surgicsense-backend-secret
          readinessProbe:
            httpGet:
              path: /docs
              port: api
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /docs
              port: api
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 300m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 4Gi
