apiVersion: apps/v1
kind: Deployment
metadata:
  name: pollutionmap-backend
  namespace: pollutionmap
  labels:
    app: pollutionmap-backend
spec:
  replicas: 2
  selector: 
    matchLabels:
      app: pollutionmap-backend
  template:
    metadata:
      labels:
        app: pollutionmap-backend
    spec:
      containers:
        - name: pollutionmap-backend
          image: ghcr.io/curatimexai/nightingale-pollutionmap-backend:61d740ba473f7c306720bc46a56a9b9ab855bc4e
          envFrom:
            - secretRef:
                name: pollutionmap-secret
          ports:
            - containerPort: 3000
