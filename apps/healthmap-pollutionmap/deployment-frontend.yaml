apiVersion: apps/v1
kind: Deployment
metadata:
  name: pollutionmap-frontend
  namespace: pollutionmap
  labels:
    app: pollutionmap-frontend
spec:
  replicas: 1
  
  selector:
    matchLabels:
      app: pollutionmap-frontend
  template:
    metadata:
      labels:
        app: pollutionmap-frontend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: pollutionmap-frontend
          image: ghcr.io/curatimexai/nightingale-pollutionmap-frontend:4a374aaf647747e76d6aedff30d06fdec692396b
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            