apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pollutionmap-backend-hpa
  namespace: pollutionmap
spec:
   scaleTargetRef:
      apiVersion: apps/v1
      kind: Deployment
      name: pollutionmap-backend
   minReplicas: 1
   maxReplicas: 6
   metrics: 
     - type: Resource
       resource : 
          name: cpu 
          target:
            type: Utilization
            averageUtilization: 75
