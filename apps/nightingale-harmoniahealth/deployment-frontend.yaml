apiVersion: apps/v1
kind: Deployment
metadata:
  name: harmoniahealth-frontend
  namespace: nightingale-harmoniahealth
  labels:
    app.kubernetes.io/name: harmoniahealth-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: nightingale-harmoniahealth
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: harmoniahealth-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harmoniahealth-frontend
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: nightingale-harmoniahealth
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: frontend
          image: ghcr.io/curatimexai/nightingale-harmoniahealth-frontend:d65587117ff9ebf38b4a801f92943c768cd22aa6
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
