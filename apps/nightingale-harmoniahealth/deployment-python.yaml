apiVersion: apps/v1
kind: Deployment
metadata:
  name: harmoniahealth-python
  namespace: nightingale-harmoniahealth
  labels:
    app.kubernetes.io/name: harmoniahealth-python
    app.kubernetes.io/component: python-backend
    app.kubernetes.io/part-of: nightingale-harmoniahealth
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: harmoniahealth-python
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harmoniahealth-python
        app.kubernetes.io/component: python-backend
        app.kubernetes.io/part-of: nightingale-harmoniahealth
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: python
          image: ghcr.io/curatimexai/nightingale-harmoniahealth-python:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 6989
          env:
            - name: NODE_PORT
              value: "6987"
          envFrom:
            - secretRef:
                name: harmoniahealth-secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
