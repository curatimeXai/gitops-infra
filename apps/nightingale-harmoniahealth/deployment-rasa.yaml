apiVersion: apps/v1
kind: Deployment
metadata:
  name: harmoniahealth-rasa
  namespace: nightingale-harmoniahealth
  labels:
    app.kubernetes.io/name: harmoniahealth-rasa
    app.kubernetes.io/component: rasa
    app.kubernetes.io/part-of: nightingale-harmoniahealth
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: harmoniahealth-rasa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harmoniahealth-rasa
        app.kubernetes.io/component: rasa
        app.kubernetes.io/part-of: nightingale-harmoniahealth
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: rasa
          image: ghcr.io/curatimexai/nightingale-harmoniahealth-rasa:8c14c69
          imagePullPolicy: Always
          ports:
            - name: rasa
              containerPort: 5005
          env:
            - name: LOG_LEVEL
              value: "WARNING"
          readinessProbe:
            httpGet:
              path: /
              port: rasa
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /
              port: rasa
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
        - name: actions
          image: ghcr.io/curatimexai/nightingale-harmoniahealth-rasa-actions:8c14c69
          imagePullPolicy: Always
          ports:
            - name: actions
              containerPort: 5055
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
