apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiwhatif-backend
  namespace: ai-whatif
  labels:
    app: aiwhatif-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aiwhatif-backend
  template:
    metadata:
      labels:
        app: aiwhatif-backend
    spec:
      containers:
        - name: aiwhatif-backend
          image: ghcr.io/curatimexai/nightingale-aiwhatif-backend:82e8cca3a10e0f4f59f4013e43288a5e4c679c1e
          envFrom:
            - secretRef:
                name: aiwhatif-secret
          ports:
            - containerPort: 9000
