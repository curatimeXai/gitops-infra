apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiwhatif-backend
  namespace: ai-whatif
  labels:
    app: aiwhatif-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aiwhatif-backend
  template:
    metadata:
      labels:
        app: aiwhatif-backend
    spec:
      containers:
        - name: aiwhatif-backend
          image: ghcr.io/curatimeXai/nightingale-aiwhatif-backend:latest
          envFrom:
            - secretRef:
                name: aiwhatif-secret
          ports:
            - containerPort: 9000
