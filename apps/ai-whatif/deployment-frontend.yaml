apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiwhatif-frontend
  namespace: ai-whatif
  labels:
    app: aiwhatif-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aiwhatif-frontend
  template:
    metadata:
      labels:
        app: aiwhatif-frontend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: aiwhatif-frontend
          image: ghcr.io/curatimexai/nightingale-aiwhatif-frontend:b388a7a2f6f22afd8f1c51526d31282a82a8ac8c
          ports:
            - containerPort: 80
