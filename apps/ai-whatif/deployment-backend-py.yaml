apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiwhatif-backend-py
  namespace: ai-whatif
  labels:
    app: aiwhatif-backend-py
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aiwhatif-backend-py
  template:
    metadata:
      labels:
        app: aiwhatif-backend-py
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: aiwhatif-backend-py
          image: ghcr.io/curatimexai/nightingale-aiwhatif-backend-python:b388a7a2f6f22afd8f1c51526d31282a82a8ac8c
          envFrom:
            - secretRef:
                name: aiwhatif-secret
          ports:
            - containerPort: 8000
