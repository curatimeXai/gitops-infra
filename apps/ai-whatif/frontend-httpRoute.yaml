apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-aiWhatif-HTTPRoute
  namespace: ai-whatif
spec:
 parentRefs:
 - name:  api-gateway
   sectioName: https
 hostnames:
 - aiwhatif.nightingaleheart.com
 rules:
 - matches:
   - path:
      type: PathPrefix
      value: /  
   backendRefs:
   - name: aiwhatif-frontend-service
     port: 80 
     