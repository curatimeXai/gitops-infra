apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiwhatif-backend-r
  namespace: ai-whatif
  labels:
    app: aiwhatif-backend-r
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aiwhatif-backend-r
  template:
    metadata:
      labels:
        app: aiwhatif-backend-r
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: aiwhatif-backend-r
          image: ghcr.io/curatimexai/nightingale-aiwhatif-backend-r:9c251b951b9905898edf05285ad3d95676f74f8c
          envFrom:
            - secretRef:
                name: aiwhatif-secret
          ports:
            - containerPort: 9000
