apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiwhatif-backend-r
  namespace: ai-whatif
  labels:
    app: aiwhatif-backend-r
spec:
  
  selector:
    matchLabels:
      app: aiwhatif-backend-r
  template:
    metadata:
      labels:
        app: aiwhatif-backend-r
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: aiwhatif-backend-r
          image: ghcr.io/curatimexai/nightingale-aiwhatif-backend-r:6f3caa6899af03609bb00959b7f994d1d945886b
          envFrom:
            - secretRef:
                name: aiwhatif-secret
          ports:
            - containerPort: 9000
          resources:
            requests:
              cpu: 250m
              memory: 2Gi
            limits:
              cpu: 500m
              memory: 4Gi
