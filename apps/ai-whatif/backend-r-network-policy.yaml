apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backendR-network-policy
  namespace: ai-whatif
spec:
  podSelector:
    matchLabels:
      app: aiwhatif-backend-r
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
       matchLabels:
        kubernetes.io/metadata.name: ingress-nginx
    ports:
    - protocol: TCP
      port: 9000
  
   
      