apiVersion: v1
kind: Secret
metadata:
  name: adaptatutor-backend-secret
  namespace: healthmap-adaptatutor
type: Opaque
stringData:
  # PostgreSQL / UpCloud Managed Database
  # Exemple:
  # DATABASE_URL: "postgresql://adaptatutor:PASSWORD@HOST:PORT/adaptatutor"
  DATABASE_URL: "CHANGE_ME"

  # Azure Speech Services
  AZURE_SPEECH_KEY: "CHANGE_ME"
  AZURE_SPEECH_REGION: "swedencentral"
  AZURE_SPEECH_ENDPOINT: "CHANGE_ME"

  # JWT/auth
  JWT_SECRET_KEY: "CHANGE_ME"

  # Initial admin account used by initialization scripts
  ADMIN_USERNAME: "CHANGE_ME"
  ADMIN_EMAIL: "CHANGE_ME"
  ADMIN_PASSWORD: "CHANGE_ME"

  # CORS
  FRONTEND_URL: "https://adaptatutor.nightingaleheart.com"
  ALLOWED_ORIGINS: "https://adaptatutor.nightingaleheart.com"
