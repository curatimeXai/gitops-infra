apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cloud-web-route
  namespace: default
spec:
  parentRefs:
    - name: upcloud-cilium-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: aiwhatif-frontend-service
          port: 80
          namespace: ai-whatif
