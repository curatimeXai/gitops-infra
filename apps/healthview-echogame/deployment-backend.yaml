apiVersion: apps/v1
kind: Deployment
metadata:
  name: echogame-backend
  namespace: healthview-echogame
  labels:
    app.kubernetes.io/name: echogame-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: healthview-echogame
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: echogame-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: echogame-backend
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: healthview-echogame
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: echogame-backend
          image: ghcr.io/curatimexai/healthview-echogame-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: FLASK_ENV
              value: production
            - name: CDN_BASE_URL
              value: https://cdn.echogame.nightingaleheart.com
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
