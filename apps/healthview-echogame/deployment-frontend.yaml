apiVersion: apps/v1
kind: Deployment
metadata:
  name: echogame-frontend
  namespace: healthview-echogame
  labels:
    app.kubernetes.io/name: echogame-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: healthview-echogame
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: echogame-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: echogame-frontend
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: healthview-echogame
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: echogame-frontend
          image: ghcr.io/curatimexai/healthview-echogame-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NEXT_PUBLIC_BACKEND_URL
              value: https://api-echogame.nightingaleheart.com
            - name: NEXT_PUBLIC_API_URL
              value: https://api-echogame.nightingaleheart.com
            - name: NEXT_PUBLIC_S3_BASE_URL
              value: https://cdn.echogame.nightingaleheart.com
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
