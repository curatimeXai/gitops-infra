apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cardiomegaly-ingress
  namespace: healthview-cardiomegaly-cnn
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - cardiomegaly-cnn.nightingaleheart.com
        - api-cardiomegaly.nightingaleheart.com
      secretName: cardiomegaly-tls
  rules:
    - host: cardiomegaly-cnn.nightingaleheart.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cardiomegaly-frontend-service
                port:
                  number: 80
    - host: api-cardiomegaly.nightingaleheart.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cardiomegaly-backend-service
                port:
                  number: 8000
