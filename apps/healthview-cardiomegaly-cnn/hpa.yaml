apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cardiomegaly-hpa
  namespace: healthview-cardiomegaly-cnn
  spec:
    scaleTargetRef:
      apiVersion: apps/v1
      kind: Deployment
      name: cardiomegaly-backend
    minReplicas: 1
    maxReplicas: 6
    metrics:
      - type: Resource
        resource : 
          name: cpu 
          target:
            type: Utilization
            averageUtilization: 75
