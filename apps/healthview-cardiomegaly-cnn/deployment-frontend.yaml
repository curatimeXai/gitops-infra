apiVersion: apps/v1
kind: Deployment
metadata:
  name: cardiomegaly-frontend
  namespace: healthview-cardiomegaly-cnn
  labels:
    app: cardiomegaly-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cardiomegaly-frontend
  template:
    metadata:
      labels:
        app: cardiomegaly-frontend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: cardiomegaly-frontend
          image: ghcr.io/curatimexai/healthview-cardiomegaly-cnn-frontend:6d88179aef3915bf4eac8619dfff4f93478603e3
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          