name: Reusable workflow for deploy apps on kubernetes cluster
on:
  workflow_call:
    inputs:
      app-name:
        required: true
        type: string
      frontend-image:
        required: false
        type: string
      backend-image:
        required: false
        type: string
      frontend-context:
        required: false
        type: string
      backend-context:
        required: false
        type: string
      api-url:
        required: false
        type: string
        default: ""
    secrets:
      GH_APP_ID:
        required: true
      GH_APP_PRIVATE_KEY:
        required: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4


      - name: Generate GitHub App token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: curatimeXai
     
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Free up disk space
        run: |
          echo "Disk before cleanup:"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          echo "Disk after cleanup:"; df -h /

      - name: Build and push frontend image
        if: inputs.frontend-context != ''
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ghcr.io/curatimexai/${{ inputs.frontend-image }}:${{ github.sha }}
          context: ${{ inputs.frontend-context }}
          build-args: API_URL=${{ inputs.api-url }}

      - name: Build and push backend image
        if: inputs.backend-context != ''
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ghcr.io/curatimexai/${{ inputs.backend-image }}:${{ github.sha }}
          context: ${{ inputs.backend-context }}
          build-args: GITHUB_PAT=${{ secrets.GITHUB_TOKEN }}

      - name: Update image tags in gitops-infra
        run: |
          git clone https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/curatimeXai/gitops-infra.git
          cd gitops-infra
          if [[ -n "${{ inputs.frontend-image }}" ]];
          then sed -i "s|image: ghcr.io/curatimexai/${{ inputs.frontend-image }}:.*|image: ghcr.io/curatimexai/${{ inputs.frontend-image }}:${{ github.sha }}|" apps/${{ inputs.app-name }}/deployment-frontend.yaml
          fi
          if [[ -n "${{ inputs.backend-image }}" ]];
          then sed -i "s|image: ghcr.io/curatimexai/${{ inputs.backend-image }}:.*|image: ghcr.io/curatimexai/${{ inputs.backend-image }}:${{ github.sha }}|" apps/${{ inputs.app-name }}/deployment-backend.yaml
          fi 
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add .
          git commit -m "Update ${{ inputs.app-name }} images to ${{ github.sha }}"
          git push origin master
